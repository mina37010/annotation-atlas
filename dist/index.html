<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="IIIF Annotationの領域を、画像の一覧で探索。">
  <title>Annotation Atlas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header>
    <div class="topline"><a class="brand" href="./" aria-label="Annotation Atlas ホーム">Annotation Atlas</a><div class="header-actions"><button id="demo" class="quiet">サンプルを見る</button><button id="open-import" class="primary"><span aria-hidden="true">＋</span> Manifestを読み込む</button></div></div>
    <div class="searchline"><div class="searchbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="Annotationのテキストを検索" aria-label="Annotationのテキストを検索" autocomplete="off"></div><label class="text-switch"><span>テキスト</span><input id="show-text" type="checkbox"><span class="switch" aria-hidden="true"></span></label><div class="density"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><input type="range" id="size" min="100" max="360" value="205" aria-label="画像の表示サイズ"></div></div>
  </header>
  <main>
    <div class="collection-bar"><div class="collection-title"><h1 id="collection-name">Annotation Atlas</h1><span id="sample-badge" class="sample-badge" hidden>サンプル</span></div><div class="collection-meta"><span id="count" aria-live="polite">0 images</span></div></div>
    <div id="status" role="status" hidden></div>
    <details id="warnings" hidden><summary></summary><ul></ul></details>
    <div id="gallery" class="gallery" aria-label="Annotation画像の一覧"></div>
    <div id="empty" class="empty" hidden><span aria-hidden="true">⌕</span><p id="empty-message">一致するAnnotationがありません</p><button id="clear-search" class="outline">検索をクリア</button><button id="empty-import" class="outline" hidden>Manifestを読み込む</button></div>
  </main>
  <footer><span id="attribution"></span></footer>
  <dialog id="import-dialog"><form id="import-form"><div class="dialog-heading"><div><h2>Manifestを読み込む</h2></div><button class="icon-button" type="button" data-close="import-dialog" aria-label="閉じる">×</button></div><label class="field-label" for="manifest-url">IIIF Manifest URL</label><input id="manifest-url" type="url" placeholder="https://…/manifest.json" autocomplete="url"><button class="primary load-button" type="submit">URLから読み込む</button><div class="divider"><span>または</span></div><label class="file-drop" id="file-drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg><strong>JSONファイルを選択</strong><span>ここにドラッグ＆ドロップ</span><input type="file" id="manifest-file" accept=".json,application/json,application/ld+json"></label><p id="import-error" class="error" role="alert" hidden></p></form></dialog>
  <dialog id="detail-dialog" class="detail-dialog"><div class="detail-image"><img id="detail-img" alt=""><button class="detail-close icon-button" data-close="detail-dialog" aria-label="閉じる">×</button><div class="detail-nav"><button id="previous" class="icon-button" aria-label="前の画像">‹</button><span id="detail-position"></span><button id="next" class="icon-button" aria-label="次の画像">›</button></div></div><div class="detail-info"><span class="eyebrow">ANNOTATION</span><h2 id="detail-page"></h2><p id="detail-text"></p><dl><dt>領域</dt><dd id="detail-region"></dd></dl><a id="image-link" class="primary" target="_blank" rel="noopener noreferrer">切り抜き画像を開く</a><div class="copy-actions"><button id="copy-image" class="outline" type="button">画像をコピー</button><button id="copy-url" class="outline" type="button">画像URLをコピー</button></div><button id="open-mirador" class="outline mirador-button" type="button">Miradorで開く</button><p id="detail-status" class="detail-status" role="status" aria-live="polite" hidden></p></div></dialog>
<dialog id="mirador-dialog" class="mirador-dialog"><div class="mirador-heading"><h2>Mirador</h2><button class="icon-button" data-close="mirador-dialog" aria-label="閉じる">×</button></div><p id="mirador-status" role="status">Miradorを読み込み中…</p><div id="mirador-container"></div></dialog>
</body>
</html>
