<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161918">
  <meta name="description" content="IIIF Annotationの領域を、画像の一覧で探索。">
  <title>Annotation Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23161918'/%3E%3Cpath d='M10 10h8v8h-8zm12 0h8v14h-8zM10 22h8v8h-8zm12 6h8v2h-8z' fill='%23d8fa73'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header>
    <div class="topline"><a class="brand" href="./" aria-label="Annotation Atlas ホーム"><span class="brandmark"><i></i><i></i><i></i><i></i></span>annotation<span class="brand-light">atlas</span><span class="beta">IIIF</span></a><div class="header-actions"><button id="demo" class="quiet">サンプルを見る</button><button id="open-import" class="primary"><span aria-hidden="true">＋</span> Manifestを読み込む</button></div></div>
    <div class="searchline"><div class="searchbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="Annotationのテキストを検索" aria-label="Annotationのテキストを検索" autocomplete="off"><kbd aria-hidden="true">/</kbd></div><label class="text-switch"><input id="show-text" type="checkbox"><span class="switch" aria-hidden="true"></span><span>テキスト</span></label><div class="density"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><input type="range" id="size" min="100" max="360" value="205" aria-label="画像の表示サイズ"></div></div>
  </header>
  <main>
    <div class="collection-bar"><div class="collection-title"><span class="collection-symbol" aria-hidden="true">◫</span><h1 id="collection-name">Annotation Atlas</h1><span id="sample-badge" class="sample-badge" hidden>サンプル</span></div><div class="collection-meta"><span id="count" aria-live="polite">0 images</span><span class="layout-label">MASONRY VIEW</span></div></div>
    <div id="status" role="status" hidden></div>
    <details id="warnings" hidden><summary></summary><ul></ul></details>
    <div id="gallery" class="gallery" aria-label="Annotation画像の一覧"></div>
    <div id="empty" class="empty" hidden><span aria-hidden="true">⌕</span><p id="empty-message">一致するAnnotationがありません</p><button id="clear-search" class="outline">検索をクリア</button><button id="empty-import" class="outline" hidden>Manifestを読み込む</button></div>
  </main>
  <footer><span id="attribution">IIIF ANNOTATION EXPLORER</span><span>見つける。切り取る。並べる。</span></footer>
  <dialog id="import-dialog"><form id="import-form"><div class="dialog-heading"><div><span class="eyebrow">OPEN A COLLECTION</span><h2>Manifestを読み込む</h2></div><button class="icon-button" type="button" data-close="import-dialog" aria-label="閉じる">×</button></div><label class="field-label" for="manifest-url">IIIF Manifest URL</label><input id="manifest-url" type="url" placeholder="https://…/manifest.json" autocomplete="url"><button class="primary load-button" type="submit">URLから読み込む</button><div class="divider"><span>または</span></div><label class="file-drop" id="file-drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg><strong>JSONファイルを選択</strong><span>ここにドラッグ＆ドロップ</span><input type="file" id="manifest-file" accept=".json,application/json,application/ld+json"></label><p id="import-error" class="error" role="alert" hidden></p><p class="dialog-footnote">IIIF Presentation v2 / v3 · xywh / FragmentSelector</p></form></dialog>
  <dialog id="detail-dialog" class="detail-dialog"><div class="detail-image"><img id="detail-img" alt=""><button class="detail-close icon-button" data-close="detail-dialog" aria-label="閉じる">×</button><div class="detail-nav"><button id="previous" class="icon-button" aria-label="前の画像">‹</button><span id="detail-position"></span><button id="next" class="icon-button" aria-label="次の画像">›</button></div></div><div class="detail-info"><span class="eyebrow">ANNOTATION</span><h2 id="detail-page"></h2><p id="detail-text"></p><dl><dt>領域</dt><dd id="detail-region"></dd></dl><a id="image-link" class="primary" target="_blank" rel="noopener noreferrer">切り抜き画像を開く</a><a id="canvas-link" class="quiet" target="_blank" rel="noopener noreferrer">Canvasを開く</a></div></dialog>
</body>
</html>
